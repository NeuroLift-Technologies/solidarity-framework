name: Compare Upstream Public Governance

on:
  pull_request:
    paths:
      - "nltotoi.json"
      - "AGENTS.md"
      - "GOVERNANCE.md"
      - "SOPs/**"
      - "templates/**"
      - "ISSUE_TEMPLATE/**"
      - ".github/scripts/compare-public-governance.py"
      - ".github/workflows/sync-governance-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NeuroLift-Technologies/.github
          ref: main
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - name: Verify imports and preview upstream changes
        run: python3 source/.github/scripts/compare-public-governance.py source upstream | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
